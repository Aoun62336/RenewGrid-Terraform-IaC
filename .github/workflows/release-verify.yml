name: Git Release Verification

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag format and provenance
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="$GITHUB_REF_NAME"

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $TAG_NAME"
            exit 1
          fi

          TAG_TYPE="$(git cat-file -t "refs/tags/$TAG_NAME")"

          if [[ "$TAG_TYPE" != "tag" ]]; then
            echo "Release requires an annotated Git tag."
            exit 1
          fi

          git fetch origin +refs/heads/main:refs/remotes/origin/main

          RELEASE_COMMIT="$(
            git rev-parse "refs/tags/$TAG_NAME^{commit}"
          )"

          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Error: Release commit $RELEASE_COMMIT is not an ancestor of origin/main."
            exit 1
          fi

          echo "Release tag verified: $TAG_NAME"
          echo "Commit: $RELEASE_COMMIT"
